# CI (PLAN P0.1, P1.13, §6 security gate, P9.1). Required checks on `main`: test, image, secrets, codeql, zap.
# Third-party actions are pinned to full commit SHAs (the tag is in the trailing comment); Dependabot bumps them.
name: CI

# Owner decision 2026-11-09 (Actions minutes budget): CI runs only when started by hand, at most twice a day, on the
# batched head that is about to reach `main` (`gh workflow run ci.yml --ref <branch>`). Pushes and pull requests do not
# start it; the full suite runs locally on every change instead. The required checks above still gate `main`: a commit
# reaches it only after a successful run on that exact commit.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  FORCE_COLOR: "1"

jobs:
  test:
    name: Lint, audit and E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: clone
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: clone/package-lock.json
      - name: Prepare temp dir
        # Tests create their SQLite files under os.tmpdir(); keep them under runner.temp so failures can be uploaded.
        run: |
          mkdir -p "$RUNNER_TEMP/e2e"
          echo "TMPDIR=$RUNNER_TEMP/e2e" >> "$GITHUB_ENV"
      - name: Install dependencies (lockfile only)
        run: npm ci
        env:
          SKIP_GIT_HOOKS: "1"
      - name: Dependency audit (high and critical)
        run: npm audit --audit-level=high
      - name: Lint (unsafe DOM sinks, env documentation)
        run: npm run lint
      - name: Secret scan of tracked files (bundled scanner)
        run: node ../scripts/secret-scan.js --all
      - name: Build
        run: npm run build --if-present
      - name: Performance budgets (compressed script and stylesheet sizes, PLAN P8.6)
        run: npm run perf:budget
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e 2>&1 | tee "$TMPDIR/e2e-output.txt"
        shell: bash -o pipefail {0}
      - name: Upload test artefacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artefacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/e2e/
            clone/test-results/
          if-no-files-found: ignore
          retention-days: 14

  image:
    # PLAN P9.1 / P9.5 (CLONE_SPEC.md §39.2, §39.9): the production image is built, scanned (Trivy: fixable high or critical
    # findings fail the build), described (CycloneDX SBOM), smoke-tested the way production runs it (read-only, non-root,
    # NODE_ENV=production: the config guard, /healthz, /readyz, a page, a sign-in, metrics only on the private port), and a
    # short load test runs against a fresh server. Tools run from images pinned by digest (no third-party actions).
    name: Container image (build, Trivy, SBOM, smoke, load smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRIVY_IMAGE: aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: clone/package-lock.json
      - name: Install dependencies (for the smoke and load scripts)
        working-directory: clone
        run: npm ci
        env:
          SKIP_GIT_HOOKS: "1"
      - name: Build the image
        run: docker build -t parlance:ci .
      - name: Trivy vulnerability scan (fail on fixable high / critical)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP:/out" "$TRIVY_IMAGE" image \
            --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --format table parlance:ci
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP:/out" "$TRIVY_IMAGE" image \
            --format json --output /out/trivy.json parlance:ci
      - name: CycloneDX SBOM
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP:/out" "$TRIVY_IMAGE" image --format cyclonedx --output /out/sbom.cdx.json parlance:ci
      - name: Container smoke test
        working-directory: clone
        run: node --no-warnings scripts/container-smoke.js parlance:ci
      - name: Load smoke (orders, cancels, WebSocket fan-out, pages, signed Trade API)
        working-directory: clone
        run: |
          npm run build
          node --no-warnings scripts/load.js --profile smoke --report "$RUNNER_TEMP/load-smoke.json"
      - name: Upload SBOM, scan and load report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sbom.cdx.json
            ${{ runner.temp }}/trivy.json
            ${{ runner.temp }}/load-smoke.json
          if-no-files-found: ignore
          retention-days: 30

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # PR review comments on findings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: a secret removed in a later commit is still a leak
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # only needed for organisation-owned repositories
          GITLEAKS_VERSION: "8.30.1" # same version as the documented local check; bump deliberately
          GITLEAKS_CONFIG: .gitleaks.toml

  codeql:
    name: CodeQL (javascript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths:
              - clone/server
              - clone/public
              - scripts
            paths-ignore:
              - clone/node_modules
              - evidence
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript

  zap:
    name: OWASP ZAP baseline (DAST)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ZAP_TARGET: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: clone/package-lock.json
      - name: Install and build
        working-directory: clone
        run: |
          npm ci
          npm run build --if-present
        env:
          SKIP_GIT_HOOKS: "1"
      - name: Start the server (fresh database, sports simulation off)
        working-directory: clone
        run: |
          nohup node --no-warnings server/index.js > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null "$ZAP_TARGET/v1/session"; then echo "server is up"; exit 0; fi
            sleep 1
          done
          echo "server did not start"; cat "$RUNNER_TEMP/server.log"; exit 1
        env:
          PORT: "3000"
          SPORTS: "0"
          DB_FILE: ${{ runner.temp }}/zap.db
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ env.ZAP_TARGET }}
          rules_file_name: .zap/rules.tsv
          cmd_options: "-a -j -m 3"
          fail_action: false # the gate below decides, by risk level and the reviewed rules file
          allow_issue_writing: false
          artifact_name: zap-baseline-report
      - name: Gate on high/medium findings
        run: node scripts/zap-gate.js report_json.json .zap/rules.tsv
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-server-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/server.log
          if-no-files-found: ignore
          retention-days: 14
