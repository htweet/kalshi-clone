# Alertmanager (CLONE_SPEC.md §39.5): alerts to the owner's email and phone. The phone is reached through a webhook
# (an SMS gateway, a push service such as ntfy, or a chat app) — the provider is the owner's choice; set
# ALERT_PHONE_WEBHOOK in deploy/.env. Values come from the environment (--config.expand-env).
global:
  smtp_smarthost: ${ALERT_SMTP_HOST}
  smtp_from: ${ALERT_SMTP_FROM}
  smtp_auth_username: ${ALERT_SMTP_USER}
  smtp_auth_password: ${ALERT_SMTP_PASSWORD}
  smtp_require_tls: true

route:
  receiver: owner
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  routes:
    - matchers: [severity="critical"]
      receiver: owner-phone-and-email
      repeat_interval: 30m

receivers:
  - name: owner
    email_configs:
      - to: ${ALERT_EMAIL}
        send_resolved: true
  - name: owner-phone-and-email
    email_configs:
      - to: ${ALERT_EMAIL}
        send_resolved: true
    webhook_configs:
      - url: ${ALERT_PHONE_WEBHOOK}
        send_resolved: true
