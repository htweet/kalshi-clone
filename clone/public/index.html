<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parlance Exchange</title>
  <meta name="description" content="Trade yes/no contracts on real-world outcomes.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23008751'/%3E%3Cpath d='M10 24V8h7.5a5 5 0 010 10H10' fill='none' stroke='%23fff' stroke-width='3.2' stroke-linejoin='round'/%3E%3C/svg%3E">
  <!-- Progressive Web App (CLONE_SPEC.md §31): manifest, browser UI colour, home-screen icon and title. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#008751" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#13a866" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Parlance">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="plx-boot" content="__PLX_BOOT__">
  <!-- Served through the server's page template (server/security.js): the nonce placeholders become a per-response
       CSP nonce and plx-boot a signed boot proof for the client token. Fonts are self-hosted (fonts.css, SIL OFL). -->
  <link rel="stylesheet" href="/fonts.css" nonce="__CSP_NONCE__">
  <link rel="stylesheet" href="/app.css" nonce="__CSP_NONCE__">
  <link rel="stylesheet" href="/perps.css" nonce="__CSP_NONCE__">
  <link rel="stylesheet" href="/combos.css" nonce="__CSP_NONCE__">
  <link rel="stylesheet" href="/admin.css" nonce="__CSP_NONCE__">
  <link rel="stylesheet" href="/sports.css" nonce="__CSP_NONCE__">
  <link rel="stylesheet" href="/chat.css" nonce="__CSP_NONCE__">
  <link rel="stylesheet" href="/social2.css" nonce="__CSP_NONCE__">
  <link rel="stylesheet" href="/account.css" nonce="__CSP_NONCE__">
  <link rel="stylesheet" href="/payments.css" nonce="__CSP_NONCE__">
  <link rel="stylesheet" href="/markets5b.css" nonce="__CSP_NONCE__">
  <link rel="stylesheet" href="/trading.css" nonce="__CSP_NONCE__">
  <link rel="stylesheet" href="/pwa.css" nonce="__CSP_NONCE__">
  <link rel="stylesheet" href="/playmode.css" nonce="__CSP_NONCE__">
  <link rel="stylesheet" href="/developer.css" nonce="__CSP_NONCE__">
  <link rel="stylesheet" href="/utilities.css" nonce="__CSP_NONCE__">
  <!-- CMS (CLONE_SPEC.md §32): the published content bundle (texts, media, footer) loads before the app modules so
       strings read while they evaluate already see the published values. Custom brand colours add a /content-theme.css
       stylesheet (CSS custom properties), inserted by the server when the brand differs from the code defaults. -->
  <script nonce="__CSP_NONCE__" src="/content-bundle.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="topbar-row">
        <a class="brand" href="/" data-link aria-label="Parlance home" data-t-attr="aria-label:shell.html.brand_home">
          <span class="brand-logo" id="brand-logo" hidden></span><span class="brand-name" data-t="shell.html.brand_name">Parlance</span>
        </a>
        <nav class="primary-nav" aria-label="Primary" data-t-attr="aria-label:shell.html.nav_primary">
          <a href="/browse" data-link data-nav="markets" data-t="shell.html.nav_markets">Markets</a>
          <a href="/perps" data-link data-nav="invest" data-t="shell.html.nav_invest" data-flag="perps">Invest</a>
          <a href="/live" data-link data-nav="live"><span data-t="shell.html.nav_live">Live</span> <span class="live-badge" id="live-count" aria-label="live events" data-t-attr="aria-label:shell.html.live_events">·</span></a>
          <a href="/pro" data-link data-nav="pro" data-t="shell.html.nav_pro">Pro</a>
          <div class="nav-more"><button id="more-btn" data-menu-btn aria-haspopup="true" aria-label="More" data-t-attr="aria-label:shell.html.nav_more"><span data-t="shell.html.nav_more">More</span> <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2"/></svg></button></div>
        </nav>
        <form class="search" id="search-form" role="search">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input id="search-input" name="q" type="search" placeholder="Trade on anything" aria-label="Search markets" autocomplete="off" data-t-attr="placeholder:shell.html.search_placeholder;aria-label:shell.html.search_label">
        </form>
        <div class="account" id="account-area"></div>
      </div>
      <nav class="category-strip" id="category-strip" aria-label="Categories" data-t-attr="aria-label:shell.html.categories"></nav>
    </div>
  </header>
  <div class="banner" id="conn-banner" hidden data-t="shell.html.reconnecting">Reconnecting to live prices…</div>
  <main id="view" tabindex="-1"></main>
  <div class="toast-host" id="toasts" aria-live="polite"></div>
  <footer class="footer">
    <!-- Footer: tagline and link columns from the CMS (Admin › Content › Pages & footer), rendered by content-live.js. -->
    <div class="container"><span>Parlance Exchange · demo build · simulated funds only</span><span><a href="/browse" data-link>Markets</a> · <a href="/calendar" data-link>Calendar</a> · <a href="/social" data-link>Social</a></span></div>
  </footer>
  <script type="module" nonce="__CSP_NONCE__" src="/js/main.js"></script>
</body>
</html>
