<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parlance Exchange</title>
  <meta name="description" content="Trade yes/no contracts on real-world outcomes.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23413bd1'/%3E%3Cpath d='M9 22V10h7a4 4 0 010 8h-7' fill='none' stroke='%23ffc94d' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <a class="brand" href="/" data-link aria-label="Parlance home">
        <span class="brand-mark">P</span><span class="brand-name">Parlance</span>
      </a>
      <nav class="primary-nav" aria-label="Primary">
        <a href="/browse" data-link>Browse</a>
        <a href="/browse?live=1" data-link>Live <span class="live-badge" id="live-count" aria-label="live events">·</span></a>
        <a href="/watchlist" data-link>Watchlist</a>
      </nav>
      <form class="search" id="search-form" role="search">
        <input id="search-input" name="q" type="search" placeholder="Search outcomes, teams, topics…" aria-label="Search markets" autocomplete="off">
      </form>
      <div class="account" id="account-area"></div>
    </div>
    <nav class="category-strip" id="category-strip" aria-label="Categories"></nav>
  </header>
  <div class="banner" id="conn-banner" hidden>Reconnecting to live prices…</div>
  <main id="view" tabindex="-1"></main>
  <div class="toast-host" id="toasts" aria-live="polite"></div>
  <footer class="footer">
    <span>Parlance Exchange — demo build. Simulated funds only.</span>
  </footer>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
