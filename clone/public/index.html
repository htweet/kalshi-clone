<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parlance Exchange</title>
  <meta name="description" content="Trade yes/no contracts on real-world outcomes.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234b3fe0'/%3E%3Cpath d='M10 24V8h7.5a5 5 0 010 10H10' fill='none' stroke='%23fff' stroke-width='3.2' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;750&display=swap">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="topbar-row">
        <a class="brand" href="/" data-link aria-label="Parlance home">
          <span class="brand-mark"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 13V3h4a3 3 0 010 6h-4" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></span><span class="brand-name">Parlance</span>
        </a>
        <nav class="primary-nav" aria-label="Primary">
          <a href="/browse" data-link data-nav="markets">Markets</a>
          <a href="/live" data-link data-nav="live">Live <span class="live-badge" id="live-count" aria-label="live events">·</span></a>
          <a href="/social" data-link data-nav="social">Social</a>
          <a href="/calendar" data-link data-nav="calendar">Calendar</a>
        </nav>
        <form class="search" id="search-form" role="search">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input id="search-input" name="q" type="search" placeholder="Search markets or profiles" aria-label="Search markets" autocomplete="off">
        </form>
        <div class="account" id="account-area"></div>
      </div>
      <nav class="category-strip" id="category-strip" aria-label="Categories"></nav>
    </div>
  </header>
  <div class="banner" id="conn-banner" hidden>Reconnecting to live prices…</div>
  <main id="view" tabindex="-1"></main>
  <div class="toast-host" id="toasts" aria-live="polite"></div>
  <footer class="footer">
    <div class="container"><span>Parlance Exchange · demo build · simulated funds only</span><span><a href="/browse" data-link>Markets</a> · <a href="/calendar" data-link>Calendar</a> · <a href="/social" data-link>Social</a></span></div>
  </footer>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
